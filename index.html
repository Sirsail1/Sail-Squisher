<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sail Analyser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            margin: 10px;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .canvas-container {
            margin-top: 30px;
            display: none;
        }

        .canvas-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .canvas-box {
            text-align: center;
            position: relative;
        }

        .canvas-box h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 1.1em;
        }

        canvas, #mobilePreview {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* This allows the user to long-press the canvas on mobile */
        #mobilePreview {
            position: absolute;
            top: 32px; /* Adjust based on H3 height */
            left: 0;
            width: 100%;
            opacity: 0;
            -webkit-touch-callout: default;
        }

        .info {
            background: #f0f2ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #555;
            line-height: 1.5;
        }

        .controls {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .slider-row:last-child {
            margin-bottom: 0;
        }

        .slider-row label {
            flex: 0 0 110px;
            color: #333;
            font-size: 0.9em;
            font-weight: 600;
        }

        .slider-row input[type="range"] {
            flex: 1;
            accent-color: #667eea;
        }

        .slider-value {
            flex: 0 0 55px;
            text-align: right;
            color: #667eea;
            font-weight: 600;
            font-size: 0.9em;
        }

        .reset-link {
            background: none;
            border: none;
            color: #764ba2;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.85em;
            padding: 0;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding: 16px;
            }

            .canvas-wrapper {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .container {
                padding: 24px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 16px;
                border-radius: 14px;
            }

            h1 {
                font-size: 1.5em;
            }

            .subtitle {
                font-size: 0.85em;
                margin-bottom: 20px;
            }

            .upload-area {
                padding: 24px 16px;
            }

            .upload-icon {
                font-size: 2.4em;
                margin-bottom: 10px;
            }

            .btn {
                width: 100%;
                margin: 6px 0;
                padding: 12px 20px;
            }

            .controls {
                padding: 16px;
            }

            .slider-row {
                gap: 10px;
            }

            .slider-row label {
                flex-basis: 70px;
                font-size: 0.85em;
            }

            .slider-value {
                flex-basis: 48px;
                font-size: 0.85em;
            }

            .info {
                font-size: 0.85em;
            }
        }

        @media (min-width: 1200px) {
            .container {
                max-width: 1000px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛵ Quick Sail Analyser</h1>
        <p class="subtitle">Stretch your sails: widen the image while keeping its height</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <p style="font-size: 1.1em; margin-bottom: 10px;">Drop an image here or click to upload</p>
            <p style="color: #999; font-size: 0.9em;">Supports JPG, PNG, GIF</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="canvas-container" id="canvasContainer">
            <div class="controls">
                <div class="slider-row">
                    <label for="widthSlider">Width</label>
                    <input type="range" id="widthSlider" min="50" max="300" step="5" value="200">
                    <span class="slider-value" id="widthValue">200%</span>
                </div>
                <button class="reset-link" id="resetSlidersBtn">Reset to default</button>
            </div>
            <div class="canvas-wrapper">
                <div class="canvas-box">
                    <h3>Original</h3>
                    <canvas id="originalCanvas"></canvas>
                </div>
                <div class="canvas-box">
                    <h3>Transformed</h3>
                    <canvas id="transformedCanvas"></canvas>
                    <img id="mobilePreview" alt="Long press to save">
                </div>
            </div>
            <div style="text-align: center;">
                <button class="btn" id="downloadBtn">Download Image</button>
                <button class="btn" id="resetBtn" style="background: #666;">Upload New Image</button>
            </div>
            <div class="info" id="info"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const originalCanvas = document.getElementById('originalCanvas');
        const transformedCanvas = document.getElementById('transformedCanvas');
        const mobilePreview = document.getElementById('mobilePreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const info = document.getElementById('info');
        const widthSlider = document.getElementById('widthSlider');
        const widthValue = document.getElementById('widthValue');
        const resetSlidersBtn = document.getElementById('resetSlidersBtn');

        // Default squish setting — the slider always starts here for every new image.
        // Height is never touched: it always stays at the original height.
        const DEFAULT_WIDTH_PCT = 200;

        let currentImage = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) processImage(file);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                processImage(file);
            }
        });

        function processImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => displayImages(img);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function displayImages(img) {
            currentImage = img;

            // Every new image starts from the default squish setting.
            widthSlider.value = DEFAULT_WIDTH_PCT;
            updateSliderLabels();

            const origCtx = originalCanvas.getContext('2d');
            originalCanvas.width = img.width;
            originalCanvas.height = img.height;
            origCtx.drawImage(img, 0, 0);

            canvasContainer.style.display = 'block';

            renderTransformed();
        }

        function renderTransformed() {
            if (!currentImage) return;

            const widthPct = Number(widthSlider.value);

            const newWidth = Math.max(1, Math.round(currentImage.width * (widthPct / 100)));
            const newHeight = currentImage.height;

            transformedCanvas.width = newWidth;
            transformedCanvas.height = newHeight;

            const transCtx = transformedCanvas.getContext('2d');
            transCtx.imageSmoothingEnabled = true;
            transCtx.imageSmoothingQuality = 'high';
            transCtx.clearRect(0, 0, newWidth, newHeight);
            transCtx.drawImage(currentImage, 0, 0, newWidth, newHeight);

            // Refresh the mobile "ghost" image so long-press-to-save always
            // matches whatever the slider is currently set to.
            mobilePreview.src = transformedCanvas.toDataURL('image/png');

            info.innerHTML = `
                <strong>Original:</strong> ${currentImage.width} × ${currentImage.height}px<br>
                <strong>Transformed:</strong> ${newWidth} × ${newHeight}px<br>
                <em>Width set to ${widthPct}% of original, height unchanged</em><br>
                <span style="color: #667eea;">📱 <strong>Mobile Tip:</strong> Long-press the transformed image and select "Save to Photos".</span>
            `;
        }

        function updateSliderLabels() {
            widthValue.textContent = `${widthSlider.value}%`;
        }

        widthSlider.addEventListener('input', () => {
            updateSliderLabels();
            renderTransformed();
        });

        resetSlidersBtn.addEventListener('click', () => {
            widthSlider.value = DEFAULT_WIDTH_PCT;
            updateSliderLabels();
            renderTransformed();
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'sail-analysed.png';
            link.href = transformedCanvas.toDataURL('image/png');
            link.click();

            // Fallback for some mobile browsers: open in new tab
            if(window.navigator.userAgent.match(/iPhone|iPad|iPod|Android/i)) {
                const newTab = window.open();
                newTab.document.write(`<img src="${link.href}" style="width:100%" />`);
                newTab.document.title = "Save Image";
            }
        });

        resetBtn.addEventListener('click', () => {
            canvasContainer.style.display = 'none';
            fileInput.value = '';
            mobilePreview.src = '';
            currentImage = null;
        });
    </script>
</body>
</html>
